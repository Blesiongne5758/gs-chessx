# Include the map and limit zones inside the http {} block of nginx.conf.
map $http_origin $gsx_cors_origin {
    default "";
    "https://chessx.example.com" $http_origin;
}

limit_req_zone $binary_remote_addr zone=gsx_eligibility:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=gsx_connections:10m;

upstream gsx_proof_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name proof.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proof.example.com;

    ssl_certificate /etc/letsencrypt/live/proof.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proof.example.com/privkey.pem;
    client_max_body_size 16k;
    server_tokens off;

    location = /health {
        proxy_pass http://gsx_proof_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location = /eligibility {
        limit_req zone=gsx_eligibility burst=10 nodelay;
        limit_req_status 429;
        limit_conn gsx_connections 10;

        add_header Access-Control-Allow-Origin $gsx_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $gsx_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary "Origin" always;
            add_header Content-Length 0;
            return 204;
        }

        limit_except GET { deny all; }
        proxy_pass http://gsx_proof_backend/eligibility;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / { return 404; }
}
